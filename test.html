// 轮询等待条件成立（后台标签 setTimeout 会被浏览器节流放大数十倍，固定等待不可靠）
// interval 用极小值（100ms → 节流放大后仍能较快检查）+ 超时 60s（真实时间）
function waitUntil(cond, cb, timeoutMs = 60000, interval = 100) {
    const t0 = Date.now();
    const iv = setInterval(() => {
        let ok = false;
        try { ok = cond(); } catch (e) {}
        if (ok || Date.now() - t0 > timeoutMs) {
            clearInterval(iv);
            cb(ok);
        }
    }, interval);
}

// 与客户端 ActivityRun（Scripts_Activity.js:884-898）生成的格式一致
function fireActivity(activityName, target, groupName) {
    const data = {
        Type: 'Activity', Sender: 12345, Content: 'ChatSelf-' + (groupName || 'ItemMouth') + '-' + activityName,
        Dictionary: [
            { ActivityName: activityName },
            { Tag: 'FocusAssetGroup', FocusGroupName: groupName || 'ItemMouth' },
            { TargetCharacter: target },
        ],
    };
    if (window.__hooks['ChatRoomMessage']) {
        window.__hooks['ChatRoomMessage']([data], () => {});
    }
}

// 制作描述压缩编码（与客户端 CraftingDescription.Encode 同款，用于测试解码）
function craftDescEncode(text) {
    let ret = '\x00', i = 0;
    const iMax = Math.min(199, Math.ceil(text.length / 2));
    while (i < iMax) {
        const a = text.charCodeAt(i * 2), b = text.charCodeAt(1 + i * 2);
        if (Number.isNaN(b)) ret += String.fromCharCode(a * 256);
        else ret += String.fromCharCode(a * 256 + b);
        i++;
    }
    return ret;
}

    // 4. 关键词触发流程（喝下带关键词的饮料）

        Craft: { Name: '神秘的人格药水', Description: '喝下后会发生什么', MemberNumber: 12345, Property: 'Normal' },
        Color: undefined, Difficulty: 1, Property: {},
    };
    fireActivity('SipItem', 12345);
    setTimeout(() => {
        const status = window.PEX.status();
        check('喝下关键词饮料触发流程', status.includes('等待'), status);
    }, 300);

    // 4b. 回归：ChatRoomRun 每帧调用不得刷服务器消息（曾因每帧触发 onEnter → 每帧
    //   setTimeout → publishSharedSettings 每秒几十条 AccountUpdate → 队列积压，
    //   打字 10-20 秒延迟 + 服务器限流踢人；mock 里 ChatRoomRun 由测试手动调用）
    setTimeout(() => {
        window.__accUpdates = 0;
        const origQ = window.ServerAccountUpdate.QueueData;
        window.ServerAccountUpdate.QueueData = (data, force) => { if (data?.OnlineSharedSettings) window.__accUpdates++; };
        try {
            for (let i = 0; i < 30; i++) { if (window.__hooks['ChatRoomRun']) window.__hooks['ChatRoomRun']([], () => {}); }
        } catch (e) {}
        const n = window.__accUpdates;
        window.ServerAccountUpdate.QueueData = origQ;
        check('ChatRoomRun 每帧不刷消息（30帧 ≤1 条 AccountUpdate）', n <= 1, 'AccountUpdate 条数: ' + n);
    }, 100);

    // 5. 无关键词不触发
    setTimeout(() => {
        // 先强制恢复，再试普通饮料
        window.PEX.reset();
        handItem = {
            Asset: { Name: 'GlassFilled', Group: { Name: 'ItemHandheld' }, Description: 'a filled glass' },
            Craft: { Name: '普通的橙汁', Description: '好喝', MemberNumber: 12345, Property: 'Normal' },
            Color: undefined, Difficulty: 1, Property: {},
        };
        fireActivity('SipItem', 12345);
        setTimeout(() => {
            const status = window.PEX.status();
            check('无关键词不触发', status.includes('正常'), status);
        }, 300);
    }, 800);

    // 6. 普通凝胶关键词
    setTimeout(() => {
        handItem = {
            Asset: { Name: 'GlassFilled', Group: { Name: 'ItemHandheld' }, Description: 'a filled glass' },
            Craft: { Name: '舒缓凝胶药剂', Description: '温和的东西', MemberNumber: 12345, Property: 'Normal' },
            Color: undefined, Difficulty: 1, Property: {},
        };
        fireActivity('SipItem', 12345);
        setTimeout(() => {
            const status = window.PEX.status();
            check('普通凝胶触发', status.includes('等待'), status);
            window.PEX.reset();
        }, 300);
    }, 1600);

    // 7. 强制恢复
    setTimeout(() => {
        window.PEX.reset();
        const status = window.PEX.status();
        check('强制恢复', status.includes('正常'), status);

        // ── 8. 制作描述压缩编码里的关键词（真实场景：ASCII 描述开"ASCII 描述"选项后被

        window.PEX.reset();

            Asset: { Name: 'GlassFilled', Group: { Name: 'ItemHandheld' }, Description: 'a filled glass' },
            Craft: { Name: '神秘饮料', Description: craftDescEncode('blessed persona potion brew'), MemberNumber: 12345, Property: 'Normal' },
            Color: undefined, Difficulty: 1, Property: {},
        };
        fireActivity('SipItem', 12345);
        setTimeout(() => {
            const sE = window.PEX.status();
            check('编码描述中的关键词能触发', sE.includes('等待'), sE);
            window.PEX.reset();

            // ── 9. 雕刻描述（item.Description）里的关键词 ──
            handItem = {
                Asset: { Name: 'GlassFilled', Group: { Name: 'ItemHandheld' }, Description: 'a filled glass' },
                Craft: null,
                Description: '刻着"人格药水"四个字的杯子',
                Color: undefined, Difficulty: 1, Property: {},
            };
            fireActivity('SipItem', 12345);
            setTimeout(() => {
                const sD = window.PEX.status();
                check('雕刻描述中的关键词能触发', sD.includes('等待'), sD);
                window.PEX.reset();
                handItem = null;

                // ── 深层：臀部被挡流程 ──
                deepFlow();
            }, 400);
        }, 400);
    }, 2600);

    function deepFlow() {
        L('info', '—— 深层测试：臀部被挡流程 ——');
        const cfg = window.PEX.getConfig();
        cfg.waitSeconds = 0;   // 立即到排出时刻
        __buttBlocked = true;
        handItem = {
            Asset: { Name: 'GlassFilled', Group: { Name: 'ItemHandheld' }, Description: 'a filled glass' },
            Craft: { Name: '神秘的人格药水', Description: '测试', MemberNumber: 12345, Property: 'Normal' },
            Color: undefined, Difficulty: 1, Property: {},
        };
        fireActivity('SipItem', 12345);
        setTimeout(() => {
            const s1 = window.PEX.status();
            check('臀部被挡进入等待', s1.includes('等待'), s1);
            // 拿掉遮挡 → 立刻排出 → 失神（轮询等状态，后台标签节流安全）
            __buttBlocked = false;
            waitUntil(() => window.PEX.status().includes('失神'), () => {
                const s2 = window.PEX.status();
                // 凝胶 = 层 7 伪资产（画在角色画布身体层，被衣服遮住）
                check('拿掉遮挡后失神+凝胶', s2.includes('失神'), s2 + ' / 凝胶: 层 7 身体层');
                check('失神时禁言激活', window.__pexSpeechBlock === undefined ? 'n/a' : 'skip');
                const cvEl2 = document.getElementById('MainCanvas');
                check('排出后画面无抖动', !cvEl2.style.transform, 'transform=' + (cvEl2.style.transform || '无'));
                // 失神不能动：CanWalk/CanInteract 被封锁（不能走/离开房间/做动作/拿东西）
                const cw = window.__hooks['Player.CanWalk']([], () => true);
                const ci = window.__hooks['Player.CanInteract']([], () => true);
                const ccc = window.__hooks['Player.CanChangeOwnClothes']([], () => true);
                const acp = window.__hooks['ActivityCheckPrerequisites']([{ Name: 'RubItem' }, fakePlayer, fakeOther, { Name: 'ItemHands' }], () => true);
                // 姿势 = 原生拘束：PoseRefresh 后允许列表全空（姿势菜单禁用）
                let poseEmpty = false;
                if (window.__hooks['PoseRefresh']) {
                    fakePlayer.AllowedActivePoseMapping = { BodyUpper: ['Kneel'], BodyLower: ['BaseLower'] };
                    window.__hooks['PoseRefresh']([fakePlayer], () => {});
                    poseEmpty = !(fakePlayer.AllowedActivePoseMapping.BodyUpper || []).length;
                }
                // 表情弹回：玩家改表情 → 立即恢复失神表情（Dazed）
                let eyesBack = null;
                if (window.__hooks['CharacterSetFacialExpression']) {
                    fakePlayer.Appearance.forEach(a => { if (a.Property) a.Property.Expression = null; });
                    window.__hooks['CharacterSetFacialExpression']([fakePlayer, 'Eyes', 'Closed', undefined, undefined, true], () => {});
                    eyesBack = fakePlayer.Appearance.find(a => a.Asset.Group.Name === 'Eyes')?.Property?.Expression;
                }
                // 不眨眼：BlinkFactor 被设成极大值
                const noBlink = fakePlayer.BlinkFactor === 999999;
                check('失神不能动', cw === false && ci === false && ccc === false && acp === false && poseEmpty && eyesBack === 'Dazed' && noBlink,

                // 失神视野：BC 原生失明叠加（默认 2 级）

                check('失神视野（原生失明）', bl === 2, 'blind=' + bl);
                // Action 播报翻译兜底：MISSING TEXT 前缀 → 返回原文
                const tq = window.__hooks['TextQueryMultiple'](['某人喝下了什么奇怪的东西'], () => 'MISSING TEXT IN "Interface.csv": 某人喝下了什么奇怪的东西');
                check('Action 播报无 MISSING 前缀', tq === '某人喝下了什么奇怪的东西', '结果: ' + tq);

                    check('放回后主人恢复', s3.includes('正常') && cw2 === true && poseRestored,
                        s3 + ' / CanWalk=' + cw2 + ' 姿势恢复=' + poseRestored);

    // ── 新功能用例：本地通道 / 表情序列 / 远程凝胶 ──
    function extraTests() {
        // 10. ActivityRun 本地通道（自己对自己喝 → 直接触发，不依赖网络回声）
        window.PEX.reset();
        handItem = {
            Asset: { Name: 'GlassFilled', Group: { Name: 'ItemHandheld' }, Description: 'a filled glass' },
            Craft: { Name: '神秘的人格药水', Description: '测试', MemberNumber: 12345, Property: 'Normal' },
            Color: undefined, Difficulty: 1, Property: {},
        };
        // waitSeconds 调小（2s）：节流放大后 WAITING 也能在超时内观测到
        const cfg10 = window.PEX.getConfig();
        cfg10.waitSeconds = 2;
        window.__hooks['ActivityRun']([fakePlayer, fakePlayer, { Name: 'ItemMouth' }, { Activity: { Name: 'SipItem' }, Item: handItem }], () => {});
        // 10. 检查"等待排出"（轮询：后台标签节流下固定 300ms 可能延迟到流程已结束）

            const sA = window.PEX.status();
            check('ActivityRun 本地通道触发', sA.includes('等待'), sA);
            window.PEX.reset();

            // 11. 等待期表情与音效同步（喝下后按段数同步触发；waitSeconds=2 → 1 段在 1s）
            const cfg2 = window.PEX.getConfig();
            cfg2.waitSeconds = 2;
            // 固定等待表情池（避免随机），池内一组：VeryLewd
            cfg2.expressions = {
                wait: [{ Eyebrows: 'Soft', Eyes: 'VeryLewd', Mouth: 'Frown', Blush: 'High' }],
                excrete: { Eyebrows: 'Raised', Eyes: 'LewdHeartPink', Mouth: 'Ahegao', Blush: 'VeryHigh' },

            const s1 = window.__audioStarts;
            window.__hooks['ChatRoomMessage']([{
                Type: 'Hidden', Content: 'PEX_Sound', Sender: 12345,   // 自己 → 不回播

                check('其他玩家音效开关开 → 播；自己的消息不回播', s1 === s0 + 1 && window.__audioStarts === s1,
                    'remote=' + (s1 - s0) + ' self=' + (window.__audioStarts - s1));
                cfg.hearRemoteSounds = false;
                // 16e2. 音量随特效强度（effectLevel=3 → 0.55+3*0.09=0.82）——强度不是摆设
                cfg.hearRemoteSounds = true;   // 先开接收（16e 结尾已关）
                cfg.effectLevel = 3;
                window.__audioStarts = 0;
                window.__hooks['ChatRoomMessage']([{
                    Type: 'Hidden', Content: 'PEX_Sound', Sender: 99999,
                    Dictionary: [{ Tag: 'Kind', Value: 'wait' }, { Tag: 'Id', Value: 'http://remote2.mp3' }],
                }], () => {});
                waitUntil(() => window.__audioStarts >= 1, () => {
                    const vol = window.__lastGain?.gain?.value;
                    check('音量随特效强度（lv3 → 0.82）', typeof vol === 'number' && Math.abs(vol - 0.82) < 0.001, 'vol=' + vol);
                    cfg.effectLevel = 3;
                    cfg.hearRemoteSounds = false;
                    // 16f. 旧存档迁移：sounds.drink → wait；expressions 旧数组 → 新结构（确定性：直接写旧格式账号存档）
                    const oldExprs = [
            { Eyebrows: 'Soft', Eyes: 'VeryLewd', Mouth: 'Frown', Blush: 'High' },
            { Eyebrows: 'Lowered', Eyes: 'HeartPink', Mouth: 'Moan', Blush: 'High' },
            { Eyebrows: 'Raised', Eyes: 'LewdHeartPink', Mouth: 'Ahegao', Blush: 'VeryHigh' },
            { Eyebrows: 'Lowered', Eyes: 'Dazed', Mouth: 'Frown', Blush: 'VeryHigh' },
        ];
        try {
            localStorage.setItem('PEX_sounds', JSON.stringify({ drink: ['http://old-drink.mp3'] }));
            fakePlayer.ExtensionSettings.PEX = LZString.compressToBase64(JSON.stringify({
                ts: Date.now(), v: 1, enabled: true, keywords: ['人格药水'], normalKeywords: ['凝胶药剂'],
                waitSeconds: 30, expressions: oldExprs,
            }));
        } catch (e) {}
        try { window.PEX.reload(); } catch (e) {}
        cfg = window.PEX.getConfig();
        const migratedWait = cfg.sounds.wait || [];
        const migratedExpr = cfg.expressions || {};
        check('旧存档迁移：drink 并入 wait', migratedWait.some(u => u === 'http://old-drink.mp3'), 'wait 数=' + migratedWait.length);
        check('旧存档迁移：expressions 数组 → wait 池 2 组 + excrete + blank',
            Array.isArray(migratedExpr.wait) && migratedExpr.wait.length === 2
            && migratedExpr.excrete?.Eyes === 'LewdHeartPink' && migratedExpr.blank?.Eyes === 'Dazed',
            'wait=' + (Array.isArray(migratedExpr.wait) ? migratedExpr.wait.length : '?'));
        // 16f2. 音效空数组存档不再覆盖默认（旧存档 {wait:[],excrete:[],feed:[]} → 仍回默认 CDN）
        try { localStorage.setItem('PEX_sounds', JSON.stringify({ sounds: { wait: [], excrete: [], feed: [] } })); } catch (e) {}
        try { window.PEX.reload(); } catch (e) {}
        cfg = window.PEX.getConfig();
        check('空数组存档回默认音效（排出/放回恢复）',
            (cfg.sounds.wait || []).length === 5 && (cfg.sounds.excrete || []).length === 1
            && (cfg.sounds.feed || []).length === 1,
            'wait=' + (cfg.sounds.wait || []).length + ' excrete=' + (cfg.sounds.excrete || []).length + ' feed=' + (cfg.sounds.feed || []).length);
        // 还原：清掉迁移产物（存档 + 备份一起清，防 loadSettings 把备份补回账号）
        try { localStorage.removeItem('PEX_sounds'); } catch (e) {}
        try { localStorage.removeItem('PEX_settings_backup_12345'); } catch (e) {}
        delete fakePlayer.ExtensionSettings.PEX;
        try { window.PEX.reload(); } catch (e) {}
        cfg = window.PEX.getConfig();
        cfg.sounds = { wait: defSounds, excrete: [], feed: [] };
        configDefaultsTest();
                }, 300000);   // 16e2 音量轮询
            }, 300);          // 16e 自己的消息等待
        }, 300000);           // 16e 播放轮询
    }

    // 测试用：等待段数与段位置（与插件同公式）
    function waitFxSegment(sec) { return Math.max(1, Math.min(5, Math.floor((sec || 0) / 10))); }
    function waitFxTimes(waitMs, n) {
        const out = [];
        for (let k = 1; k <= n; k++) out.push(waitMs * k / (n + 1));
        return out;
    }

    function configDefaultsTest() {
        // 17. 关键词默认（先清本地旧存档 + 账号存档再重载，保证走默认值）
        try { localStorage.removeItem('PEX_settings_backup_12345'); } catch (e) {}
        delete fakePlayer.ExtensionSettings.PEX;
        try { window.PEX.reload(); } catch (e) {}
        const cfg = window.PEX.getConfig();
        const kw = cfg.keywords || [];
        const nkw = cfg.normalKeywords || [];
        check('人格凝胶关键词默认 4 个',
            kw.length === 4 && kw.includes('人格药水') && kw.includes('人格药剂')
            && kw.includes('persona potion') && kw.includes('personality extraction'),
            JSON.stringify(kw));
        check('普通凝胶关键词默认 4 个',
            nkw.length === 4 && nkw.includes('凝胶药剂') && nkw.includes('凝胶药水')
            && nkw.includes('plain gel') && nkw.includes('normal gel'),
            JSON.stringify(nkw));
        remoteEditTests();
    }

    function remoteEditTests() {
        // 14. 远程修改：按钮位置 / 权限实时缓存救活 / 打开面板 / 查看与应用播报
        const origDB = window.DrawButton;
        let dbArgs = null;
        window.DrawButton = (...a) => { dbArgs = a; origDB(...a); };
        const origSend = window.ServerSend;
        window.__sendLog = [];
        window.ServerSend = (cmd, data) => { window.__sendLog.push({ cmd, data }); origSend(cmd, data); };
        window.InformationSheetSelection = fakeOther;   // 资料页目标
        // 对方公告：白名单模式但我不在名单（OSS 快照 → 无权限）——模拟房间同步的过时快照
        fakeOther.OnlineSharedSettings.PEX = {
            state: null, edit: true,
            editModes: { time: 'whitelist', autoRevert: 'whitelist', timerVisibility: 'whitelist' },
            wl: [],
        };
        window.__hooks['InformationSheetRun']([], () => {});
        // 14a. 按钮框显示（位置+Label=REX 字母占位）+ 查询发出 + 过时快照下按钮禁用
        //（PEX_PermQuery 走限速队列，后台标签节流下延迟不定 → 轮询）
        waitUntil(() => (window.__sendLog || []).some(x => x.data?.Content === 'PEX_PermQuery'), (queryOk) => {
            const btnOk = dbArgs && dbArgs[0] === 1715 && dbArgs[1] === 175;
            const btnLabel = dbArgs && dbArgs[4];
            const querySent = (window.__sendLog || []).some(x => x.data?.Content === 'PEX_PermQuery');
            check('远程按钮在资料页按钮下方 (1715,175)', btnOk, 'x=' + dbArgs?.[0] + ' y=' + dbArgs?.[1]);
            check('按钮框显示（中间 REX 字母占位）', btnLabel === 'REX', 'Label=' + btnLabel);
            check('看资料页时权限查询发出', querySent, querySent ? '✅' : '❌');
            check('过时快照（白名单未同步）按钮禁用', dbArgs?.[8] === true, 'disabled=' + dbArgs?.[8]);
            // 14b. PEX_PermReply → 缓存 → 按钮被"救活"；点击 → 访问通知 + 面板
            window.__hooks['ChatRoomMessage']([{
                Type: 'Hidden', Content: 'PEX_PermReply', Sender: 99999,
                Dictionary: [
                    { Tag: 'PEX_PermReply', Target: '12345' },
                    { Tag: 'Perms', Value: { time: true, autoRevert: true, timerVisibility: true } },
                    { Tag: 'Values', Value: { waitSeconds: 30, blockedWaitMinutes: 15, autoRevertMinutes: 15, autoRevertEnabled: true, timerVisibility: 'all' } },
                ],
            }], () => {});
            dbArgs = null;
            window.__hooks['InformationSheetRun']([], () => {});
            check('权限实时回复后按钮可用', dbArgs?.[8] === false, 'disabled=' + dbArgs?.[8]);
            window.__sendLog = [];
            window.MouseX = 1730; window.MouseY = 200;
            window.__hooks['InformationSheetClick']([], () => {});
            waitUntil(() => (window.__sendLog || []).some(x => x.data?.Content === 'PEX_Access'), (accessOk) => {
                const accessSent = (window.__sendLog || []).some(x => x.data?.Content === 'PEX_Access');
                const panelEl = document.getElementById('pex-remote-panel');
                const panelShown = !!panelEl && panelEl.style.display !== 'none';
                check('打开面板发送访问通知', accessSent, accessSent ? '✅' : '❌');
                check('远程编辑面板打开', panelShown, panelShown ? '✅' : '❌');
                // 退出资料页 → 面板自动关闭（曾因 showPanel 未置 R.open → 永远关不掉）
                try { window.__hooks['InformationSheetExit']([], () => {}); } catch (e) {}
                const panelGone = !document.getElementById('pex-remote-panel') || document.getElementById('pex-remote-panel').style.display === 'none';
                check('退出资料页面板自动关闭', panelGone, panelGone ? '✅' : '❌');
                // 14c. 查看播报接收：对方收到 PEX_Access → 本地聊天显示
                window.__hooks['ChatRoomMessage']([{
                    Type: 'Hidden', Content: 'PEX_Access', Sender: 99999,
                    Dictionary: [{ Tag: 'PEX_Access', Target: '12345' }, { Tag: 'Name', Value: '某人' }],
                }], () => {});
                const log1 = document.getElementById('TextAreaChatLog').innerText;
                check('查看资料播报', log1.includes('查看了你的 PEX 设置'), log1.slice(-60));
                // 14d. 对方应用修改 → 播报 + 配置生效（默认权限仅自己 → 先临时放开 time 权限）
                window.PEX.getConfig().editModes = { time: 'any', autoRevert: 'any', timerVisibility: 'any' };
                window.__hooks['ChatRoomMessage']([{
                    Type: 'Hidden', Content: 'PEX_RemoteSet', Sender: 99999,
                    Dictionary: [{ Tag: 'PEX_RemoteSet', Target: '12345' }, { Tag: 'Values', Value: { waitSeconds: 45 } }],
                }], () => {});
                const log2 = document.getElementById('TextAreaChatLog').innerText;
                const cfgAfter = window.PEX.getConfig().waitSeconds;
                check('被远程修改播报 + 配置生效', log2.includes('修改了你的 PEX 设置') && cfgAfter === 45,
                    'waitSeconds=' + cfgAfter);
                window.PEX.getConfig().editModes = { time: 'off', autoRevert: 'off', timerVisibility: 'off' };
                try { window.__hooks['InformationSheetExit']([], () => {}); } catch (e) {}   // 关面板
                window.DrawButton = origDB;
                window.ServerSend = origSend;
                window.InformationSheetSelection = null;
                window.MouseX = 0; window.MouseY = 0;
                settingsSmoke();
                finalSummary();
            }, 300000);
        }, 300000);
    }

    // ── 设置页（DOM 面板 7 分区）每个分区实测 ──
    function settingsSmoke() {
        try {
            const scr = window.__prefScreen;
            if (!scr) { check('设置页存在', false); return; }
            scr.load();
            scr.run();
            const panel = document.getElementById('pex-settings-panel');
            check('设置面板打开', !!panel, panel ? '✅' : '❌');
            const secBtns = panel ? panel.querySelectorAll('[data-pex-sec]') : [];
            check('设置面板 7 分区', secBtns.length === 7, '分区数=' + secBtns.length);
            for (let i = 0; i < secBtns.length; i++) {
                secBtns[i].click();
                scr.run();
            }
            check('7 分区切换渲染无异常', true);
            // 基本设置：启用开关（左右两钮，点"关"）
            secBtns[0].click(); scr.run();
            const tglEnabled = panel.querySelector('[data-pex-side="enabled"][data-pex-val="0"]');
            if (tglEnabled) tglEnabled.click();
            check('基本设置启用开关生效', window.PEX.getConfig().enabled === false, 'enabled=' + window.PEX.getConfig().enabled);
            window.PEX.getConfig().enabled = true;
            // 排出设置：失神限制开关 + 等待秒数最低 10
            secBtns[1].click(); scr.run();
            const numWait = panel.querySelector('[data-pex-number="waitSeconds"]');
            check('排出前等待最低 10 秒', !!numWait && numWait.min === '10', numWait ? ('min=' + numWait.min) : '❌');
            const tglRestr = panel.querySelector('[data-pex-side="restrictions"][data-pex-val="0"]');
            if (tglRestr) tglRestr.click();
            check('排出设置失神限制开关生效', window.PEX.getConfig().restrictions === false, 'restrictions=' + window.PEX.getConfig().restrictions);
            window.PEX.getConfig().restrictions = true;
            // 特效设置：黑白开关 + 其他玩家音效开关（默认关）+ 计时器可见性下拉 + 凝胶图层控件
            secBtns[2].click(); scr.run();
            const tglBlank = panel.querySelector('[data-pex-side="fxBlank"][data-pex-val="0"]');
            if (tglBlank) tglBlank.click();
            check('特效设置黑白开关生效', window.PEX.getConfig().fxBlank === false, 'fxBlank=' + window.PEX.getConfig().fxBlank);
            window.PEX.getConfig().fxBlank = true;
            const tglHear = panel.querySelector('[data-pex-side="hearRemoteSounds"]');
            check('其他玩家音效开关（默认关）', !!tglHear && !!panel.querySelector('[data-pex-side="hearRemoteSounds"][data-pex-val="0"].on'), '✅');
            const numLayer = panel.querySelector('[data-pex-number="gelLayer"]');
            check('凝胶图层控件（0~99）', !!numLayer && numLayer.min === '0' && numLayer.max === '99',
                numLayer ? ('min=' + numLayer.min + ' max=' + numLayer.max) : '❌');
            const selVis = panel.querySelector('[data-pex-select="timerVisibility"]');
            if (selVis) { selVis.value = 'others'; selVis.dispatchEvent(new Event('change', { bubbles: true })); }
            check('特效设置计时器可见性生效', window.PEX.getConfig().timerVisibility === 'others', 'timerVisibility=' + window.PEX.getConfig().timerVisibility);
            window.PEX.getConfig().timerVisibility = 'all';
            // 权限设置：默认仅自己 + 切换所有人生效
            secBtns[3].click(); scr.run();
            const em = window.PEX.getConfig().editModes;
            check('权限设置默认仅自己', em.time === 'off' && em.autoRevert === 'off' && em.timerVisibility === 'off', JSON.stringify(em));
            const btnAny = panel.querySelector('[data-pex-mode="time"][data-pex-mv="any"]');
            if (btnAny) btnAny.click();
            check('权限设置切换所有人生效', window.PEX.getConfig().editModes.time === 'any', 'time=' + window.PEX.getConfig().editModes.time);
            window.PEX.getConfig().editModes.time = 'off';
            // 表情设置：渲染 + 等待池新增/删除 + 预览框 + 切换刷新
            secBtns[4].click(); scr.run();
            const exprSel = panel.querySelector('[data-pex-select="expressions.blank.Eyes"]');
            if (exprSel) { exprSel.value = 'Closed'; exprSel.dispatchEvent(new Event('change', { bubbles: true })); }
            check('表情设置渲染（等待池 + 新增按钮）',
                !!panel.querySelector('[data-pex-select^="expressions.wait.0"]') && !!panel.querySelector('[data-pex-add-expr]'), '✅');
            check('表情预览框', !!panel.querySelector('#pex-expr-preview'), '✅');
            if (exprSel) { exprSel.value = 'Dazed'; exprSel.dispatchEvent(new Event('change', { bubbles: true })); }
            // 等待表情：新增一组 → 删除（弹窗二次确认）
            const addExprBtn = panel.querySelector('[data-pex-add-expr]');
            if (addExprBtn) addExprBtn.click();
            const poolAfterAdd = (window.PEX.getConfig().expressions.wait || []).length;
            check('等待表情新增一组', poolAfterAdd === 3, '池数=' + poolAfterAdd);
            const delExprBtn = panel.querySelector('[data-pex-del-expr="2"]');
            if (delExprBtn) delExprBtn.click();
            const dlgExpr = document.querySelector('.pex-confirm-dialog');
            if (dlgExpr) { const yes = dlgExpr.querySelector('.yes'); if (yes) yes.click(); }
            check('等待表情删除（弹窗确认）', (window.PEX.getConfig().expressions.wait || []).length === 2,
                '池数=' + (window.PEX.getConfig().expressions.wait || []).length);
            // 音效设置：3 类各带左右开关
            secBtns[5].click(); scr.run();
            check('音效设置渲染（3 类带开关）',
                !!panel.querySelector('[data-pex-sound="wait"]') && !!panel.querySelector('[data-pex-sound="excrete"]')
                && !!panel.querySelector('[data-pex-sound="feed"]')
                && !!panel.querySelector('[data-pex-side="soundOn.wait"]')
                && !!panel.querySelector('[data-pex-side="soundOn.excrete"]')
                && !!panel.querySelector('[data-pex-side="soundOn.feed"]'), '✅');
            const tglSndWait = panel.querySelector('[data-pex-side="soundOn.wait"][data-pex-val="0"]');
            if (tglSndWait) tglSndWait.click();
            check('音效设置等待开关生效', window.PEX.getConfig().soundOn.wait === false,
                'wait=' + window.PEX.getConfig().soundOn.wait);
            window.PEX.getConfig().soundOn.wait = true;
            // 关于：恢复默认弹窗二次确认
            secBtns[6].click(); scr.run();
            const btnReset = panel.querySelector('[data-pex-action="reset"]');
            if (btnReset) btnReset.click();
            const dlg1 = document.querySelector('.pex-confirm-dialog');
            check('恢复默认弹窗出现', !!dlg1, dlg1 ? '✅' : '❌');
            if (dlg1) { const yes = dlg1.querySelector('.yes'); if (yes) yes.click(); }
            // 基本设置：强制恢复弹窗（取消）
            secBtns[0].click(); scr.run();
            const btnRecover = panel.querySelector('[data-pex-action="recover"]');
            if (btnRecover) btnRecover.click();
            const dlg2 = document.querySelector('.pex-confirm-dialog');
            check('强制恢复弹窗出现', !!dlg2, dlg2 ? '✅' : '❌');
            if (dlg2) { const no = dlg2.querySelector('.no'); if (no) no.click(); }
            // 关闭清理
            scr.exit();
            check('设置面板关闭清理', !document.getElementById('pex-settings-panel') || document.getElementById('pex-settings-panel').style.display === 'none', '✅');
            // 点 ✕ 关闭 → 再打开 → 面板重建出现（回归：曾因 display:none 残留导致再打开空白）
            scr.run();
            const closeBtn = panel.querySelector('[data-pex-close]');
            if (closeBtn) closeBtn.click();
            const gone = !document.getElementById('pex-settings-panel');
            scr.run();
            const panel2 = document.getElementById('pex-settings-panel');
            check('点 ✕ 再打开面板重建', gone && !!panel2, (gone ? '关闭✅ ' : '关闭❌ ') + (panel2 ? '重开✅' : '重开❌'));
            scr.exit();
        } catch (e) {
            check('设置页渲染异常', false, e.message);
        }
        // /pex show 控制台面板开关
        try {
            const cmd = window.__commands && window.__commands.find(c => c.Tag === 'pex');
            if (cmd) {
                cmd.Action('show');
                const hasPanel = !!document.getElementById('pex-panel');
                cmd.Action('show');
                const closedPanel = !document.getElementById('pex-panel');
                check('/pex show 面板开关', hasPanel && closedPanel, (hasPanel ? '开✅' : '开❌') + (closedPanel ? '关✅' : '关❌'));
            } else {
                check('/pex show 面板', false, 'CommandCombine 未注册');
            }
        } catch (e) {
            check('/pex show 面板', false, e.message);
        }
    }

    function finalSummary() {
        const s = window.PEX.status();
        check('最终恢复', s.includes('正常'), s);
        L('info', '══════ 测试结束 ══════');
        const failed = results.filter(r => !r.ok).length;
        L(failed ? 'bad' : 'ok', failed ? `共 ${results.length} 项，${failed} 项失败` : `全部 ${results.length} 项通过 ✅`);
    }
}
